<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Live GPS Tracking & Status</title>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        /* Header Running Status Bar */
        .running-status-bar {
            background-color: #e74c3c;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            box-sizing: border-box;
            border-bottom: 2px solid #c0392b;
        }
        .running-status-content {
            display: inline-block;
            animation: marquee 15s linear infinite;
        }
        .running-status-content span {
            margin: 0 15px;
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
            transition: background 0.3s;
        }
        #start-gps { background-color: #27ae60; }
        #start-gps:hover { background-color: #219653; }
        #stop-gps { background-color: #c0392b; }
        #stop-gps:hover { background-color: #a93226; }
        
        #map {
            width: 100%;
            height: 400px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            text-align: center;
        }
        .stat-card {
            background: #ecf0f1;
            padding: 15px;
            border-radius: 6px;
            border-left: 5px solid #2980b9;
        }
        .stat-card h3 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #7f8c8d;
        }
        .stat-card p {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <header>
        <h1>Live Rider Navigation Panel</h1>
    </header>

    <!-- Header Running Status requested -->
    <div class="running-status-bar">
        <div class="running-status-content" id="running-status-text">
            <span>Left Place: <b>Sirsi Hub</b></span> | 
            <span>Travel Time: <b id="status-travel-time">45 mins</b></span> | 
            <span>Heading to: <b>Bangalore Depot</b></span> | 
            <span>Remaining Distance: <b id="status-remaining-dist">120.5 km</b></span>
        </div>
    </div>

    <div class="container">
        <div class="controls">
            <button id="start-gps" onclick="startTracking()">📡 START RIDER LIVE GPS</button>
            <button id="stop-gps" onclick="stopTracking()">🛑 STOP GPS</button>
        </div>

        <div id="map"></div>

        <div class="stats-panel">
            <div class="stat-card">
                <h3>Current Speed</h3>
                <p id="speed-display">0.0 km/h</p>
            </div>
            <div class="stat-card">
                <h3>Distance Covered</h3>
                <p id="distance-display">0.00 km</p>
            </div>
            <div class="stat-card">
                <h3>GPS Status</h3>
                <p id="gps-status" style="color: #c0392b;">Inactive</p>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let marker;
        let watchId = null;
        let totalDistance = 0;
        let lastPosition = null;

        // Initialize Map
        function initMap() {
            // Default center (Sirsi coordinates example)
            map = L.map('map').setView([14.6189, 74.8560], 15);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            marker = L.marker([14.6189, 74.8560]).addTo(map)
                .bindPopup('Rider Current Position')
                .openPopup();
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Radius of the earth in km
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                Math.sin(dLon/2) * Math.sin(dLon/2); 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c; // Distance in km
        }

        function deg2rad(deg) {
            return deg * (Math.PI/180);
        }

        function startTracking() {
            if (navigator.geolocation) {
                document.getElementById('gps-status').innerText = "Active";
                document.getElementById('gps-status').style.color = "#27ae60";

                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const speedMs = position.coords.speed; // meters per second
                        const speedKmh = speedMs ? (speedMs * 3.6).toFixed(1) : 0.0;

                        const newLatLng = [lat, lon];
                        marker.setLatLng(newLatLng);
                        map.setView(newLatLng, 17); // Auto-center map on rider

                        // Update speed
                        document.getElementById('speed-display').innerText = speedKmh + " km/h";

                        // Calculate distance covered if previous point exists
                        if (lastPosition) {
                            const dist = calculateDistance(lastPosition.lat, lastPosition.lon, lat, lon);
                            totalDistance += dist;
                            document.getElementById('distance-display').innerText = totalDistance.toFixed(2) + " km";
                            
                            // Dynamic updating of remaining distance simulation based on progress
                            let remaining = Math.max(0, 120.5 - totalDistance).toFixed(1);
                            document.getElementById('status-remaining-dist').innerText = remaining + " km";
                        }
                        lastPosition = { lat, lon };
                    },
                    (error) => {
                        alert("Error capturing GPS: " + error.message);
                        document.getElementById('gps-status').innerText = "Error";
                    },
                    {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 5000
                    }
                );
            } else {
                alert("Geolocation is not supported by your browser");
            }
        }

        function stopTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                document.getElementById('gps-status').innerText = "Stopped";
                document.getElementById('gps-status').style.color = "#c0392b";
            }
        }

        window.onload = initMap;
    </script>
</body>
</html>
