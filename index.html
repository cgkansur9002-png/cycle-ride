<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Sirsi Ganpati Darshan Live Tracker</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root{
      --bg-main:#070b14;
      --bg-card:#121b2f;
      --bg-panel:#0d1526;
      --border-color:#23324e;
      --accent-blue:#38bdf8;
      --accent-green:#22c55e;
      --accent-red:#ef4444;
      --accent-amber:#f59e0b;
      --text-main:#f8fafc;
      --text-sub:#94a3b8;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Inter',sans-serif;
    }

    body{
      background:var(--bg-main);
      color:var(--text-main);
      display:flex;
      flex-direction:column;
      height:100vh;
      overflow:hidden;
      position:relative;
    }

    /* HEADER */
    header{
      background:#0d1526;
      border-bottom:1px solid var(--border-color);
      padding:12px 18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:100;
      flex-shrink:0;
    }

    .brand-wrap{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .brand-badge{
      background:#0284c7;
      color:white;
      font-weight:800;
      padding:6px 12px;
      border-radius:8px;
      font-size:.8rem;
    }

    .brand-title h1{
      font-size:1.1rem;
      color:white;
      font-weight:800;
    }

    .status-badge{
      font-size:.75rem;
      font-weight:700;
      padding:6px 12px;
      border-radius:100px;
      background:rgba(34,197,94,.15);
      color:#22c55e;
      border:1px solid rgba(34,197,94,.35);
    }

    .status-badge.admin-mode{
      background:rgba(239,68,68,.15);
      color:#ef4444;
      border-color:rgba(239,68,68,.35);
    }

    /* FIXED RUNNING HERO STATUS BAR */
    .hero-status-bar{
      background:#0f172a;
      border-bottom:2px solid #38bdf8;
      padding:8px 0;
      overflow:hidden;
      white-space:nowrap;
      flex-shrink:0;
      z-index:99;
      width:100%;
    }

    .marquee-track{
      display:inline-block;
      white-space:nowrap;
      padding-left:100%;
      animation:marquee-scroll 16s linear infinite;
      font-weight:800;
      font-size:.9rem;
      letter-spacing:.5px;
      color:#dbeafe;
      will-change:transform;
    }

    @keyframes marquee-scroll{
      0%{ transform:translateX(0); }
      100%{ transform:translateX(-100%); }
    }

    /* MAIN CONTAINER */
    .dashboard-container{
      display:flex;
      flex:1;
      height:calc(100vh - 90px);
      overflow:hidden;
    }

    .sidebar{
      width:420px;
      background:var(--bg-card);
      border-right:1px solid var(--border-color);
      display:flex;
      flex-direction:column;
      height:100%;
    }

    /* CONTROL PANEL */
    .control-panel{
      padding:14px;
      background:var(--bg-panel);
      border-bottom:1px solid var(--border-color);
      flex-shrink:0;
    }

    .metrics-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .stat-card{
      background:#1a263d;
      border-radius:12px;
      padding:14px;
      border:1px solid var(--border-color);
    }

    .stat-card.delayed{
      border-color:var(--accent-red);
    }

    .stat-card.green{
      border-color:var(--accent-green);
    }

    .stat-label{
      font-size:.65rem;
      color:var(--text-sub);
      font-weight:700;
      text-transform:uppercase;
    }

    .stat-value{
      font-size:1.3rem;
      font-weight:800;
      margin-top:4px;
      color:white;
    }

    /* TIMELINE - FAST SCROLL OPTIMIZED */
    .timeline-container{
      flex:1;
      overflow-y:auto;
      padding:16px 12px;
      -webkit-overflow-scrolling:touch;
      will-change:scroll-position;
    }

    .timeline-container::-webkit-scrollbar{
      width:5px;
    }

    .timeline-container::-webkit-scrollbar-thumb{
      background:#2d3a5c;
      border-radius:10px;
    }

    .timeline-item{
      position:relative;
      padding-left:28px;
      padding-bottom:18px;
    }

    .timeline-item::before{
      content:'';
      position:absolute;
      left:8px;
      top:20px;
      bottom:0;
      width:2px;
      background:rgba(255,255,255,.10);
    }

    .timeline-item:last-child::before{
      display:none;
    }

    .timeline-node{
      position:absolute;
      left:0px;
      top:4px;
      width:18px;
      height:18px;
      border-radius:50%;
      background:#0d1526;
      border:3px solid #64748b;
      z-index:2;
    }

    .timeline-item.reached .timeline-node{
      border-color:#22c55e;
      background:#22c55e;
    }

    .timeline-item.current .timeline-node{
      border-color:#38bdf8;
      background:#070b14;
      transform:scale(1.2);
    }

    .timeline-card{
      background:#162238;
      border-radius:14px;
      border:1px solid var(--border-color);
      padding:14px;
    }

    .timeline-item.current .timeline-card{
      border:2px solid #38bdf8;
    }

    .place-name{
      font-size:.95rem;
      font-weight:800;
      color:#fff;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .sched-time{
      color:#94a3b8;
      margin-top:4px;
      font-size:.78rem;
    }

    /* HIDE / UNHIDE PHOTO TOGGLE CONTAINER */
    .photo-section-wrap{
      margin-top:10px;
    }

    .photo-toggle-btn{
      background:rgba(56,189,248,0.12);
      color:var(--accent-blue);
      border:1px solid rgba(56,189,248,0.35);
      padding:6px 12px;
      border-radius:8px;
      font-size:.75rem;
      font-weight:700;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:6px;
      transition:.2s;
    }

    .photo-toggle-btn:hover{
      background:rgba(56,189,248,0.25);
    }

    .stop-photo-container{
      margin-top:8px;
      border-radius:10px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.15);
      position:relative;
      display:none; /* HIDDEN BY DEFAULT TO SAVE MOBILE SPACE */
    }

    .stop-photo-container.visible{
      display:block;
    }

    .stop-photo{
      width:100%;
      max-height:160px;
      object-fit:cover;
      display:block;
      cursor:pointer;
    }

    .photo-download-btn{
      background:rgba(0,0,0,0.75);
      color:#38bdf8;
      font-size:.72rem;
      font-weight:700;
      padding:6px 10px;
      border-radius:6px;
      margin-top:6px;
      display:inline-block;
      text-decoration:none;
      border:1px solid var(--accent-blue);
    }

    /* TELEMETRY */
    .telemetry-box{
      margin-top:10px;
      padding-top:8px;
      border-top:1px dashed rgba(255,255,255,.10);
      display:flex;
      flex-direction:column;
      gap:4px;
      font-size:.78rem;
    }

    .tele-tag{ font-weight:700; }
    .tele-tag.arrived{ color:#22c55e; }
    .tele-tag.left{ color:#f59e0b; }
    .tele-tag.spent{ color:#38bdf8; }

    /* BUTTONS */
    .btn-wrap{
      display:flex;
      gap:8px;
      margin-top:10px;
    }

    .action-btn{
      flex:1;
      border:none;
      border-radius:8px;
      padding:10px;
      color:white;
      font-weight:800;
      cursor:pointer;
      font-size:.78rem;
    }

    .btn-arrive{ background:#059669; }
    .btn-left{ background:#d97706; }
    .btn-photo{ background:#6d28d9; }

    .travel-connector{
      font-size:.72rem;
      color:#c084fc;
      font-weight:700;
      padding:2px 0 8px 28px;
    }

    /* MAP CONTAINER */
    .map-container{
      flex:1;
      position:relative;
      height:100%;
    }

    #map{
      width:100%;
      height:100%;
      background:#111;
    }

    .cycle-marker-icon{
      font-size:26px;
      text-align:center;
    }

    .custom-pin-icon{
      display:flex;
      justify-content:center;
      align-items:center;
    }

    /* ULTRA STABLE MOBILE LAYOUT FIXES */
    @media(max-width:768px){
      body{
        height:100vh;
        overflow:hidden;
      }

      header{
        padding:8px 12px;
      }
      .brand-title h1{ font-size:.9rem; }
      .brand-badge{ font-size:.7rem; padding:4px 8px; }
      .status-badge{ font-size:.65rem; padding:4px 8px; }

      .hero-status-bar{
        padding:6px 0;
      }
      .marquee-track{ font-size:.8rem; }

      .dashboard-container{
        flex-direction:column;
        height:calc(100vh - 75px);
      }

      .map-container{
        height:32vh;
        min-height:180px;
        flex:none;
      }

      .sidebar{
        width:100%;
        flex:1;
        border-right:none;
        border-top:2px solid var(--accent-blue);
        height:auto;
        overflow:hidden;
      }

      .control-panel{
        padding:10px;
      }

      .stat-card{
        padding:10px;
      }

      .stat-value{
        font-size:1.1rem;
      }

      .timeline-container{
        padding:12px 10px;
        touch-action:pan-y;
      }

      .action-btn{
        padding:12px 6px;
        font-size:.75rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-wrap">
      <div class="brand-badge">🚴‍♂️ DISPATCH</div>
      <div class="brand-title">
        <h1>SIRSI GANPATI DARSHAN</h1>
      </div>
    </div>
    <div id="mode-badge" class="status-badge">● LIVE VIEWER</div>
  </header>

  <!-- ALWAYS VISIBLE TOP MARQUEE RUNNING STATUS -->
  <div class="hero-status-bar">
    <div class="marquee-track" id="live-hero-status">
      🔥 PREPARING FOR LAUNCH: GET READY FOR SIRSI GANPATI DARSHAN RIDE!
    </div>
  </div>

  <div class="dashboard-container">
    <div class="map-container">
      <div id="map"></div>
    </div>

    <div class="sidebar">
      <div class="control-panel">
        <div class="metrics-grid">
          <div class="stat-card" id="status-card">
            <div class="stat-label">Schedule Status</div>
            <div class="stat-value" id="delay-text">0 MINS</div>
          </div>
          <div class="stat-card green">
            <div class="stat-label">Covered Distance</div>
            <div class="stat-value" id="distance-text">0.0 KM</div>
          </div>
        </div>
      </div>

      <div class="timeline-container" id="timeline"></div>
    </div>
  </div>

  <input type="file" id="photo-file-input" accept="image/*" capture="environment" style="display:none;">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('admin') === 'true';

    const modeBadge = document.getElementById('mode-badge');
    if (isAdmin) {
      modeBadge.innerText = '⚡ ADMIN CONTROL';
      modeBadge.classList.add('admin-mode');
    }

    const firebaseConfig = {
      databaseURL: "https://ksrtc-cycle-tracker-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const routeData = [
      { id: 1, name: "Devikere", time: "16:00", lat: 14.619805, lng: 74.832288 },
      { id: 2, name: "Maratikoppa", time: "16:10", lat: 14.629540, lng: 74.836248 },
      { id: 3, name: "Bapuji Nagar", time: "16:20", lat: 14.624583, lng: 74.840028 },
      { id: 4, name: "Chipgi", time: "16:35", lat: 14.644139, lng: 74.862833 },
      { id: 5, name: "Vivekananda Nagar", time: "16:45", lat: 14.630944, lng: 74.852139 },
      { id: 6, name: "Ayappa Nagar", time: "16:55", lat: 14.627220, lng: 74.848500 },
      { id: 7, name: "Hanumagiri", time: "17:00", lat: 14.614778, lng: 74.845194 },
      { id: 8, name: "Ambedkar Bhavana", time: "17:05", lat: 14.618100, lng: 74.842500 },
      { id: 9, name: "Kotekere", time: "17:08", lat: 14.615861, lng: 74.840944 },
      { id: 10, name: "Marigudi", time: "17:15", lat: 14.612750, lng: 74.838694 },
      { id: 11, name: "Rayar Pete", time: "17:20", lat: 14.610750, lng: 74.830917 },
      { id: 12, name: "Shivaji Chowk", time: "17:25", lat: 14.614610, lng: 74.833974 },
      { id: 13, name: "Auto Stand", time: "17:30", lat: 14.614900, lng: 74.834500 },
      { id: 14, name: "Naganjaneya", time: "17:35", lat: 14.614583, lng: 74.835278 },
      { id: 15, name: "Simpi Gulli", time: "17:40", lat: 14.615250, lng: 74.834389 },
      { id: 16, name: "Unnemutt", time: "17:45", lat: 14.617139, lng: 74.832861 },
      { id: 17, name: "Shraddanand Gulli", time: "17:50", lat: 14.616194, lng: 74.832417 },
      { id: 18, name: "Zoo Circle", time: "18:00", lat: 14.618889, lng: 74.826778 },
      { id: 19, name: "Raghavendra Circle", time: "18:05", lat: 14.623083, lng: 74.827528 }
    ];

    let currentWaypointIndex = 0;
    let waypointsState = {}; 
    let map, cycleMarker;
    let mapMarkers = [];
    let completedPolyline, upcomingPolyline;
    let legPaths = []; 
    let selectedIndexForPhoto = null;

    function createPinIcon(color) {
      const svgPin = `
        <svg width="22" height="30" viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 0C5.37 0 0 5.37 0 12C0 21 12 32 12 32C12 32 24 21 24 12C24 5.37 18.63 0 12 0ZM12 16C9.79 16 8 14.21 8 12C8 9.79 9.79 8 12 8C14.21 8 16 9.79 16 12C16 14.21 14.21 16 12 16Z" fill="${color}"/>
        </svg>
      `;
      return L.divIcon({ className: 'custom-pin-icon', html: svgPin, iconSize: [22, 30], iconAnchor: [11, 30] });
    }

    async function fetchOSRMRoute() {
      const coordString = routeData.map(pt => `${pt.lng},${pt.lat}`).join(';');
      const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordString}?overview=full&geometries=geojson`;

      try {
        const response = await fetch(osrmUrl);
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          legPaths = [];
          for (let i = 0; i < routeData.length - 1; i++) {
            const startPt = [routeData[i].lat, routeData[i].lng];
            const endPt = [routeData[i + 1].lat, routeData[i + 1].lng];
            
            const legUrl = `https://router.project-osrm.org/route/v1/driving/${startPt[1]},${startPt[0]};${endPt[1]},${endPt[0]}?overview=full&geometries=geojson`;
            const legRes = await fetch(legUrl);
            const legData = await legRes.json();
            
            if (legData.routes && legData.routes[0]) {
              const legCoords = legData.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
              legPaths.push(legCoords);
            } else {
              legPaths.push([startPt, endPt]);
            }
          }
        } else {
          fallbackStraightLines();
        }
      } catch (err) {
        fallbackStraightLines();
      }

      updatePathLines();
    }

    function fallbackStraightLines() {
      legPaths = [];
      for (let i = 0; i < routeData.length - 1; i++) {
        legPaths.push([
          [routeData[i].lat, routeData[i].lng],
          [routeData[i + 1].lat, routeData[i + 1].lng]
        ]);
      }
    }

    function initMap() {
      map = L.map('map', { maxZoom: 19 }).setView([routeData[0].lat, routeData[0].lng], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        referrerPolicy: 'strict-origin-when-cross-origin',
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      completedPolyline = L.polyline([], { color: '#22c55e', weight: 3, opacity: 0.8 }).addTo(map);
      upcomingPolyline = L.polyline([], { color: '#64748b', weight: 3, opacity: 0.6, dashArray: '5, 5' }).addTo(map);

      routeData.forEach((pt, index) => {
        const pinColor = isPointArrived(index) ? '#22c55e' : '#64748b';
        const marker = L.marker([pt.lat, pt.lng], { icon: createPinIcon(pinColor) })
          .addTo(map)
          .bindPopup(`<div style="color:#000;"><b>${index + 1}. ${pt.name}</b><br>Time: ${pt.time}</div>`);
        
        mapMarkers.push(marker);
      });

      const cycleIcon = L.divIcon({ className: 'cycle-marker-icon', html: '🚴‍♂️', iconSize: [28, 28], iconAnchor: [14, 14] });
      cycleMarker = L.marker([routeData[0].lat, routeData[0].lng], { icon: cycleIcon }).addTo(map);

      fetchOSRMRoute();
    }

    function isPointArrived(index) {
      return waypointsState[index] && waypointsState[index].arrived;
    }

    function calculateLegDistance(idx1, idx2) {
      if (idx1 < 0 || idx2 >= routeData.length) return "0.0";
      const p1 = L.latLng(routeData[idx1].lat, routeData[idx1].lng);
      const p2 = L.latLng(routeData[idx2].lat, routeData[idx2].lng);
      return (p1.distanceTo(p2) / 1000).toFixed(2);
    }

    function updateHeroStatusBanner() {
      const banner = document.getElementById('live-hero-status');
      const totalStops = routeData.length;
      const curSpot = routeData[currentWaypointIndex];
      const curState = waypointsState[currentWaypointIndex] || {};
      const nextSpot = currentWaypointIndex < totalStops - 1 ? routeData[currentWaypointIndex + 1] : null;

      if (currentWaypointIndex === 0 && !curState.arrived) {
        banner.innerHTML = `🔥 THE JOURNEY BEGINS! RIDER WILL BE AT ${curSpot.name.toUpperCase()} SOON! 🚴‍♂️ &nbsp;&nbsp;•&nbsp;&nbsp; GET READY!`;
        return;
      }

      if (currentWaypointIndex === totalStops - 1 && curState.arrived) {
        banner.innerHTML = `🏆 RIDE COMPLETED! VICTORY AT ${curSpot.name.toUpperCase()}! SHREE GANPATI BAPPA MORYA! 🎉`;
        return;
      }

      if (curState.arrived && !curState.left) {
        banner.innerHTML = `✨ RIDER HAS ARRIVED AT ${curSpot.name.toUpperCase()}! DARSHAN IN PROGRESS! 🙏`;
      } else if (curState.left && nextSpot) {
        const legDist = calculateLegDistance(currentWaypointIndex, currentWaypointIndex + 1);
        banner.innerHTML = `🚀 ON THE MOVE! RIDER LEFT ${curSpot.name.toUpperCase()} — JUST ${legDist} KM AWAY FROM ${nextSpot.name.toUpperCase()}! 🚴‍♂️💨`;
      } else {
        banner.innerHTML = `🚴‍♂️ RIDER IS SPEEDING TOWARDS ${curSpot.name.toUpperCase()}! STAND BY FOR ARRIVAL! 🔥`;
      }
    }

    function updatePathLines() {
      if (legPaths.length === 0) return;

      let completedCoords = [];
      let upcomingCoords = [];

      for (let i = 0; i < legPaths.length; i++) {
        if (isPointArrived(i + 1)) {
          completedCoords.push(...legPaths[i]);
        } else {
          upcomingCoords.push(...legPaths[i]);
        }
      }

      completedPolyline.setLatLngs(completedCoords);
      upcomingPolyline.setLatLngs(upcomingCoords);

      let distMeters = 0;
      for (let i = 0; i < routeData.length; i++) {
        if (isPointArrived(i) && i > 0) {
          const p1 = L.latLng(routeData[i - 1].lat, routeData[i - 1].lng);
          const p2 = L.latLng(routeData[i].lat, routeData[i].lng);
          distMeters += p1.distanceTo(p2);
        }
      }
      document.getElementById('distance-text').innerText = `${(distMeters / 1000).toFixed(2)} KM`;

      routeData.forEach((pt, index) => {
        const pinColor = isPointArrived(index) ? '#22c55e' : (index === currentWaypointIndex ? '#38bdf8' : '#64748b');
        mapMarkers[index].setIcon(createPinIcon(pinColor));
      });
    }

    function calculateTimeDiffMinutes(timeStr1, timeStr2) {
      if (!timeStr1 || !timeStr2) return null;
      const [h1, m1] = timeStr1.split(':').map(Number);
      const [h2, m2] = timeStr2.split(':').map(Number);
      const diff = (h2 * 60 + m2) - (h1 * 60 + m1);
      return diff >= 0 ? diff : null;
    }

    // DIRECT DOWNLOAD TRIGGER FOR PHOTO
    function downloadPhoto(url, placeName) {
      const link = document.createElement('a');
      link.href = url;
      link.download = `Ganpati_Darshan_${placeName.replace(/\s+/g, '_')}.jpg`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // TOGGLE HIDE / UNHIDE PHOTO
    function togglePhotoVisibility(index) {
      const container = document.getElementById(`photo-box-${index}`);
      const btn = document.getElementById(`photo-btn-${index}`);

      if (container.classList.contains('visible')) {
        container.classList.remove('visible');
        btn.innerHTML = '📷 Show Photo';
      } else {
        container.classList.add('visible');
        btn.innerHTML = '🙈 Hide Photo';
      }
    }

    function renderTimeline() {
      const container = document.getElementById('timeline');
      container.innerHTML = '';

      routeData.forEach((pt, idx) => {
        const item = document.createElement('div');
        const state = waypointsState[idx] || {};

        let statusClass = isPointArrived(idx) ? 'reached' : (idx === currentWaypointIndex ? 'current' : '');
        item.className = `timeline-item ${statusClass}`;

        const isCurrentSpot = idx === currentWaypointIndex;
        const arrivedTime = state.arrived || null;
        const leftTime = state.left || null;
        const photoUrl = state.photo || null;

        let timeSpent = calculateTimeDiffMinutes(arrivedTime, leftTime);
        let travelDuration = null;
        if (idx > 0 && waypointsState[idx - 1]?.left && arrivedTime) {
          travelDuration = calculateTimeDiffMinutes(waypointsState[idx - 1].left, arrivedTime);
        }

        item.innerHTML = `
          <div class="timeline-node"></div>
          <div class="timeline-card">
            <div class="place-name">
              <span>${idx + 1}. ${pt.name}</span>
              ${isCurrentSpot ? '<span>🚴‍♂️</span>' : ''}
            </div>
            <div class="sched-time">Scheduled: <b>${pt.time}</b></div>

            ${photoUrl ? `
              <div class="photo-section-wrap">
                <button id="photo-btn-${idx}" class="photo-toggle-btn" onclick="togglePhotoVisibility(${idx})">📷 Show Photo</button>
                <div id="photo-box-${idx}" class="stop-photo-container">
                  <img src="${photoUrl}" class="stop-photo" alt="Photo at ${pt.name}" onclick="downloadPhoto('${photoUrl}', '${pt.name}')">
                  <a href="javascript:void(0)" class="photo-download-btn" onclick="downloadPhoto('${photoUrl}', '${pt.name}')">📥 Download Photo</a>
                </div>
              </div>
            ` : ''}

            ${(arrivedTime || leftTime || timeSpent !== null) ? `
              <div class="telemetry-box">
                ${arrivedTime ? `<div class="tele-tag arrived">📍 Arrived at: ${arrivedTime}</div>` : ''}
                ${leftTime ? `<div class="tele-tag left">🚀 Left at: ${leftTime}</div>` : ''}
                ${timeSpent !== null ? `<div class="tele-tag spent">⏱️ Time Spent: ${timeSpent} mins</div>` : ''}
              </div>
            ` : ''}

            ${isAdmin ? `
              <div class="btn-wrap">
                ${isCurrentSpot && !arrivedTime ? `<button class="action-btn btn-arrive" onclick="handleAdminAction(${idx}, 'arrive')">ARRIVED NOW</button>` : ''}
                ${isCurrentSpot && arrivedTime && !leftTime ? `<button class="action-btn btn-left" onclick="handleAdminAction(${idx}, 'left')">LEFT NOW</button>` : ''}
                ${!isCurrentSpot && waypointsState[idx - 1]?.left && !arrivedTime ? `<button class="action-btn btn-arrive" onclick="handleAdminAction(${idx}, 'arrive')">ARRIVED NOW</button>` : ''}
                
                ${arrivedTime ? `
                  <button class="action-btn btn-photo" onclick="triggerPhotoUpload(${idx})">${photoUrl ? '📷 CHANGE PHOTO' : '📷 ADD PHOTO'}</button>
                ` : ''}
              </div>
            ` : ''}
          </div>
        `;

        container.appendChild(item);

        if (travelDuration !== null) {
          const connector = document.createElement('div');
          connector.className = 'travel-connector';
          connector.innerHTML = `🚲 Travel Time from previous stop: <b>${travelDuration} mins</b>`;
          container.insertBefore(connector, item);
        }
      });
    }

    function triggerPhotoUpload(index) {
      selectedIndexForPhoto = index;
      document.getElementById('photo-file-input').click();
    }

    document.getElementById('photo-file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file || selectedIndexForPhoto === null) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 800;

          if (width > height && width > maxDim) {
            height *= maxDim / width;
            width = maxDim;
          } else if (height > maxDim) {
            width *= maxDim / height;
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const base64Image = canvas.toDataURL('image/jpeg', 0.7);

          db.ref(`liveTrack/waypoints/${selectedIndexForPhoto}/photo`).set(base64Image);
          selectedIndexForPhoto = null;
          e.target.value = '';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function handleAdminAction(index, actionType) {
      if (!isAdmin) return;

      const now = new Date();
      const currentHours = String(now.getHours()).padStart(2, '0');
      const currentMinutes = String(now.getMinutes()).padStart(2, '0');
      const timeString = `${currentHours}:${currentMinutes}`;

      const currentState = waypointsState[index] || {};

      if (actionType === 'arrive') {
        currentState.arrived = timeString;
      } else if (actionType === 'left') {
        currentState.left = timeString;
      }

      const scheduledTimeStr = routeData[index].time;
      const [schedH, schedM] = scheduledTimeStr.split(':').map(Number);
      const scheduledDate = new Date();
      scheduledDate.setHours(schedH, schedM, 0);

      const diffMins = Math.round((now - scheduledDate) / 60000);

      let targetIndex = currentWaypointIndex;
      if (actionType === 'arrive') {
        targetIndex = index;
      }

      db.ref('liveTrack').set({
        index: targetIndex,
        delayMins: diffMins,
        lastUpdated: timeString,
        waypoints: {
          ...waypointsState,
          [index]: currentState
        }
      });
    }

    db.ref('liveTrack').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        currentWaypointIndex = data.index || 0;
        waypointsState = data.waypoints || {};
        updateDelayUI(data.delayMins || 0);

        const currentPt = routeData[currentWaypointIndex];
        cycleMarker.setLatLng([currentPt.lat, currentPt.lng]);

        updateHeroStatusBanner();
        updatePathLines();
        renderTimeline();
      }
    });

    function updateDelayUI(diffMins) {
      const delayText = document.getElementById('delay-text');
      const delayCard = document.getElementById('status-card');

      if (diffMins > 0) {
        delayText.innerText = `+${diffMins} MINS`;
        delayText.style.color = 'var(--accent-red)';
        delayCard.classList.add('delayed');
      } else if (diffMins < 0) {
        delayText.innerText = `${Math.abs(diffMins)} MINS AHEAD`;
        delayText.style.color = 'var(--accent-green)';
        delayCard.classList.remove('delayed');
      } else {
        delayText.innerText = `ON TIME`;
        delayText.style.color = 'var(--accent-green)';
        delayCard.classList.remove('delayed');
      }
    }

    window.onload = () => {
      initMap();
      renderTimeline();
      updateHeroStatusBanner();
    };
  </script>
</body>
</html>
