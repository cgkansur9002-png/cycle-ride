<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Sirsi Ganpati Darshan Live Tracker</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root{
      --bg-main:#070b14;
      --bg-card:#121b2f;
      --bg-panel:#0d1526;
      --border-color:#23324e;
      --accent-blue:#38bdf8;
      --accent-green:#22c55e;
      --accent-red:#ef4444;
      --accent-amber:#f59e0b;
      --text-main:#f8fafc;
      --text-sub:#94a3b8;
    }

    *{ margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; -webkit-tap-highlight-color: transparent; }
    body{ background:var(--bg-main); color:var(--text-main); display:flex; flex-direction:column; height:100vh; overflow:hidden; position:relative; }

    header{
      background:#0d1526; border-bottom:1px solid var(--border-color); padding:10px 14px;
      display:flex; justify-content:space-between; align-items:center; z-index:100; flex-shrink:0;
    }
    .brand-wrap{ display:flex; align-items:center; gap:8px; }
    .brand-badge{ background:#0284c7; color:white; font-weight:800; padding:4px 8px; border-radius:6px; font-size:.75rem; }
    .brand-title h1{ font-size:1rem; color:white; font-weight:800; }
    .status-badge{ font-size:.7rem; font-weight:700; padding:4px 10px; border-radius:100px; background:rgba(34,197,94,.15); color:#22c55e; border:1px solid rgba(34,197,94,.35); }
    .status-badge.admin-mode{ background:rgba(239,68,68,.15); color:#ef4444; border-color:rgba(239,68,68,.35); }

    .hero-status-bar{
      background:#0f172a; border-bottom:2px solid #38bdf8; padding:6px 0;
      overflow:hidden; white-space:nowrap; flex-shrink:0; z-index:99; width:100%;
    }
    .marquee-track{
      display:inline-block; white-space:nowrap; padding-left:100%; animation:marquee-scroll 16s linear infinite;
      font-weight:800; font-size:.85rem; letter-spacing:.5px; color:#dbeafe;
    }
    @keyframes marquee-scroll{ 0%{ transform:translateX(0); } 100%{ transform:translateX(-100%); } }

    .dashboard-container{ display:flex; flex:1; height:calc(100vh - 75px); overflow:hidden; }
    .sidebar{ width:400px; background:var(--bg-card); border-right:1px solid var(--border-color); display:flex; flex-direction:column; height:100%; }
    .control-panel{ padding:12px; background:var(--bg-panel); border-bottom:1px solid var(--border-color); flex-shrink:0; }
    .metrics-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .stat-card{ background:#1a263d; border-radius:10px; padding:10px; border:1px solid var(--border-color); }
    .stat-card.green{ border-color:var(--accent-green); }
    .stat-label{ font-size:.6rem; color:var(--text-sub); font-weight:700; text-transform:uppercase; }
    .stat-value{ font-size:1rem; font-weight:800; margin-top:2px; color:white; }

    .gps-toggle-btn{
      background:#0284c7; color:white; padding:12px; border-radius:10px; width:100%;
      font-weight:800; font-size:0.85rem; border:none; cursor:pointer; margin-bottom:8px;
      box-shadow:0 4px 12px rgba(2,132,199,0.3); transition:all 0.2s ease;
    }

    .timeline-container{ flex:1; overflow-y:auto; padding:14px 10px; -webkit-overflow-scrolling:touch; }
    .timeline-item{ position:relative; padding-left:26px; padding-bottom:16px; }
    .timeline-item::before{ content:''; position:absolute; left:7px; top:18px; bottom:0; width:2px; background:rgba(255,255,255,.10); }
    .timeline-item:last-child::before{ display:none; }
    .timeline-node{ position:absolute; left:0px; top:4px; width:16px; height:16px; border-radius:50%; background:#0d1526; border:3px solid #64748b; z-index:2; }
    .timeline-item.reached .timeline-node{ border-color:#22c55e; background:#22c55e; }
    .timeline-item.current .timeline-node{ border-color:#38bdf8; background:#070b14; transform:scale(1.2); }
    .timeline-card{ background:#162238; border-radius:12px; border:1px solid var(--border-color); padding:12px; }
    .timeline-item.current .timeline-card{ border:2px solid #38bdf8; }
    .place-name{ font-size:.95rem; font-weight:800; color:#fff; display:flex; justify-content:space-between; align-items:center; }
    .sched-time{ color:#94a3b8; margin-top:4px; font-size:.75rem; }
    .actual-time-badge{ font-size:.75rem; color:#22c55e; font-weight:700; margin-top:6px; display:block; }

    .photo-section-wrap{ margin-top:10px; }
    .photo-toggle-btn{ background:rgba(56,189,248,0.12); color:var(--accent-blue); border:1px solid rgba(56,189,248,0.35); padding:6px 12px; border-radius:6px; font-size:.75rem; font-weight:700; cursor:pointer; }
    .stop-photo-container{ margin-top:8px; display:none; }
    .stop-photo-container.visible{ display:block; }
    .photos-gallery-grid{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
    .photo-card-item{ flex:0 0 130px; border-radius:8px; overflow:hidden; border:1px solid rgba(255,255,255,.15); background:#0d1526; display:flex; flex-direction:column; }
    .stop-photo{ width:100%; height:90px; object-fit:cover; display:block; cursor:pointer; }
    .photo-actions-bar{ display:flex; border-top:1px solid var(--border-color); background:rgba(0,0,0,0.8); }
    .photo-btn-action{ flex:1; color:#38bdf8; font-size:.65rem; font-weight:700; padding:6px 2px; text-align:center; text-decoration:none; border:none; cursor:pointer; display:block; }
    .photo-btn-action.btn-del-photo{ color:#ef4444; border-left:1px solid var(--border-color); }

    /* ADMIN MOBILE FRIENDLY BIG BUTTONS */
    .btn-wrap{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
    .action-btn{ width:100%; border:none; border-radius:8px; padding:12px; color:white; font-weight:800; cursor:pointer; font-size:.85rem; text-transform:uppercase; text-align:center; box-shadow:0 2px 6px rgba(0,0,0,0.3); }
    .btn-arrive{ background:#059669; }
    .btn-left{ background:#d97706; }
    .btn-photo{ background:#7c3aed; }

    .map-container{ flex:1; position:relative; height:100%; }
    #map{ width:100%; height:100%; background:#111; }
    .cycle-marker-icon{ font-size:28px; text-align:center; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.8)); }
    .custom-pin-icon{ display:flex; justify-content:center; align-items:center; }

    /* Custom Leaflet Popup Styling */
    .leaflet-popup-content-wrapper { background: #0f172a; color: #fff; border: 1px solid #38bdf8; border-radius: 12px; }
    .leaflet-popup-tip { background: #0f172a; }
    .rider-popup-card { padding: 4px; text-align: center; }
    .rider-popup-title { font-size: 1rem; font-weight: 800; color: #38bdf8; margin-bottom: 4px; }
    .speedometer-badge { background: #22c55e; color: #000; font-weight: 900; font-size: 0.9rem; padding: 4px 10px; border-radius: 20px; display: inline-block; margin: 6px 0; }

    @media(max-width:768px){
      body{ height:100vh; overflow:hidden; }
      header{ padding:8px 10px; }
      .brand-title h1{ font-size:.85rem; }
      .dashboard-container{ flex-direction:column; height:calc(100vh - 65px); }
      .map-container{ height:40vh; min-height:200px; flex:none; }
      .sidebar{ width:100%; flex:1; border-right:none; border-top:2px solid var(--accent-blue); }
      .timeline-container{ padding:10px 8px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-wrap">
      <div class="brand-badge">🚴‍♂️ DISPATCH</div>
      <div class="brand-title">
        <h1>SIRSI GANPATI DARSHAN</h1>
      </div>
    </div>
    <div id="mode-badge" class="status-badge">● LIVE VIEWER</div>
  </header>

  <div class="hero-status-bar">
    <div class="marquee-track" id="live-hero-status">
      🔥 RIDER CHINMAY IS ON THE WAY FOR SIRSI GANPATI DARSHAN!
    </div>
  </div>

  <div class="dashboard-container">
    <div class="map-container">
      <div id="map"></div>
    </div>

    <div class="sidebar">
      <div class="control-panel">
        <div id="admin-gps-panel" style="display:none;">
          <button id="gps-btn" class="gps-toggle-btn" onclick="toggleLiveRiderGPS()">📡 START RIDER LIVE GPS</button>
        </div>
        <div class="metrics-grid">
          <div class="stat-card" id="status-card">
            <div class="stat-label">Schedule Status</div>
            <div class="stat-value" id="delay-text">ON TIME</div>
          </div>
          <div class="stat-card green">
            <div class="stat-label">Covered Distance</div>
            <div class="stat-value" id="distance-text">0.0 KM</div>
          </div>
        </div>
      </div>

      <div class="timeline-container" id="timeline"></div>
    </div>
  </div>

  <input type="file" id="photo-file-input" accept="image/*" multiple capture="environment" style="display:none;">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('admin') === 'true';

    const modeBadge = document.getElementById('mode-badge');
    if (isAdmin) {
      modeBadge.innerText = '⚡ ADMIN CONTROL';
      modeBadge.classList.add('admin-mode');
      document.getElementById('admin-gps-panel').style.display = 'block';
    }

    const firebaseConfig = { databaseURL: "https://ksrtc-cycle-tracker-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const routeData = [
      { id: 1, name: "Devikere", time: "16:00", lat: 14.619805, lng: 74.832288 },
      { id: 2, name: "Maratikoppa", time: "16:10", lat: 14.629540, lng: 74.836248 },
      { id: 3, name: "Bapuji Nagar", time: "16:20", lat: 14.624583, lng: 74.840028 },
      { id: 4, name: "Chipgi", time: "16:35", lat: 14.644139, lng: 74.862833 },
      { id: 5, name: "Vivekananda Nagar", time: "16:45", lat: 14.630944, lng: 74.852139 },
      { id: 6, name: "Ayappa Nagar", time: "16:55", lat: 14.627220, lng: 74.848500 },
      { id: 7, name: "Hanumagiri", time: "17:00", lat: 14.614778, lng: 74.845194 },
      { id: 8, name: "Ambedkar Bhavana", time: "17:05", lat: 14.618100, lng: 74.842500 },
      { id: 9, name: "Kotekere", time: "17:08", lat: 14.615861, lng: 74.840944 },
      { id: 10, name: "Marigudi", time: "17:15", lat: 14.612750, lng: 74.838694 },
      { id: 11, name: "Rayar Pete", time: "17:20", lat: 14.610750, lng: 74.830917 },
      { id: 12, name: "Shivaji Chowk", time: "17:25", lat: 14.614610, lng: 74.833974 },
      { id: 13, name: "Auto Stand", time: "17:30", lat: 14.614900, lng: 74.834500 },
      { id: 14, name: "Naganjaneya", time: "17:35", lat: 14.614583, lng: 74.835278 },
      { id: 15, name: "Simpi Gulli", time: "17:40", lat: 14.615250, lng: 74.834389 },
      { id: 16, name: "Unnemutt", time: "17:45", lat: 14.617139, lng: 74.832861 },
      { id: 17, name: "Shraddanand Gulli", time: "17:50", lat: 14.616194, lng: 74.832417 },
      { id: 18, name: "Zoo Circle", time: "18:00", lat: 14.618889, lng: 74.826778 },
      { id: 19, name: "Raghavendra Circle", time: "18:05", lat: 14.623083, lng: 74.827528 }
    ];

    let currentWaypointIndex = 0;
    let waypointsState = {}; 
    let map, cycleMarker;
    let mapMarkers = [];
    let watchId = null;
    let selectedIndexForPhoto = null;
    let coveredPolyline, remainingPolyline;
    let fullRoadPath = [];
    let currentSpeed = 0;

    function createPinIcon(color) {
      const svgPin = `<svg width="22" height="30" viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C5.37 0 0 5.37 0 12C0 21 12 32 12 32C12 32 24 21 24 12C24 5.37 18.63 0 12 0ZM12 16C9.79 16 8 14.21 8 12C8 9.79 9.79 8 12 8C14.21 8 16 9.79 16 12C16 14.21 14.21 16 12 16Z" fill="${color}"/></svg>`;
      return L.divIcon({ className: 'custom-pin-icon', html: svgPin, iconSize: [22, 30], iconAnchor: [11, 30] });
    }

    async function initMap() {
      map = L.map('map', { maxZoom: 19 }).setView([routeData[0].lat, routeData[0].lng], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);

      routeData.forEach((pt, index) => {
        const marker = L.marker([pt.lat, pt.lng], { icon: createPinIcon('#38bdf8') }).addTo(map);
        marker.bindPopup(`
          <div style="font-family:Inter,sans-serif; text-align:center;">
            <b style="font-size:0.95rem; color:#38bdf8;">📍 ${index + 1}. ${pt.name}</b><br/>
            <span style="font-size:0.8rem; color:#cbd5e1;">Scheduled Arrival: <b>${pt.time}</b></span>
          </div>
        `);
        mapMarkers.push(marker);
      });

      const cycleIcon = L.divIcon({ className: 'cycle-marker-icon', html: '🚴‍♂️', iconSize: [32, 32], iconAnchor: [16, 16] });
      cycleMarker = L.marker([routeData[0].lat, routeData[0].lng], { icon: cycleIcon }).addTo(map);
      updateRiderPopup("Devikere", "Maratikoppa");

      coveredPolyline = L.polyline([], { color: '#22c55e', weight: 5, opacity: 0.9 }).addTo(map);
      remainingPolyline = L.polyline([], { color: '#64748b', weight: 4, opacity: 0.6, dashArray: '6, 8' }).addTo(map);

      await fetchOSRMRealRoads();
    }

    async function fetchOSRMRealRoads() {
      const coordString = routeData.map(p => `${p.lng},${p.lat}`).join(';');
      const url = `https://router.project-osrm.org/route/v1/biking/${coordString}?overview=full&geometries=geojson`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.routes && data.routes[0]) {
          fullRoadPath = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
          updateDynamicRoadLines();
        }
      } catch (e) {
        fullRoadPath = routeData.map(p => [p.lat, p.lng]);
        updateDynamicRoadLines();
      }
    }

    function updateDynamicRoadLines() {
      if (!fullRoadPath.length) return;
      const targetIndex = Math.min(currentWaypointIndex, routeData.length - 1);
      const currentDest = routeData[targetIndex];

      let splitIdx = 0;
      let minDistance = Infinity;
      fullRoadPath.forEach((pt, i) => {
        const d = Math.hypot(pt[0] - currentDest.lat, pt[1] - currentDest.lng);
        if (d < minDistance) { minDistance = d; splitIdx = i; }
      });

      const covered = fullRoadPath.slice(0, splitIdx + 1);
      const remaining = fullRoadPath.slice(splitIdx);

      coveredPolyline.setLatLngs(covered);
      remainingPolyline.setLatLngs(remaining);
    }

    function updateRiderPopup(fromLoc, toLoc) {
      cycleMarker.bindPopup(`
        <div class="rider-popup-card">
          <div class="rider-popup-title">🚴‍♂️ CHINMAY (RIDER)</div>
          <div class="speedometer-badge">⚡ ${currentSpeed} KM/H</div>
          <div style="font-size:0.75rem; color:#94a3b8; margin-top:4px;">
            <b>Next Destination:</b> ${toLoc || "Destination"}<br/>
            <b>From:</b> ${fromLoc || "Start"}
          </div>
        </div>
      `);
    }

    function toggleLiveRiderGPS() {
      const btn = document.getElementById('gps-btn');

      if (!navigator.geolocation) {
        alert("GPS permission not supported in your browser.");
        return;
      }

      if (watchId === null) {
        watchId = navigator.geolocation.watchPosition(
          (position) => {
            const { latitude, longitude, speed } = position.coords;
            currentSpeed = speed ? (speed * 3.6).toFixed(1) : 0;

            db.ref('liveTrack/currentGPS').set({
              lat: latitude,
              lng: longitude,
              speed: currentSpeed,
              timestamp: Date.now()
            });

            btn.innerText = "🛑 STOP LIVE GPS (TRACKING ON)";
            btn.style.background = "#ef4444";
          },
          (error) => {
            alert("GPS Error: " + error.message);
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
        );
      } else {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        btn.innerText = "📡 START RIDER LIVE GPS";
        btn.style.background = "#0284c7";
      }
    }

    db.ref('liveTrack/currentGPS').on('value', (snapshot) => {
      const gps = snapshot.val();
      if (gps && gps.lat && gps.lng) {
        const livePos = [gps.lat, gps.lng];
        currentSpeed = gps.speed || 0;
        cycleMarker.setLatLng(livePos);

        const currentSpot = routeData[currentWaypointIndex] ? routeData[currentWaypointIndex].name : "";
        const nextSpot = routeData[currentWaypointIndex + 1] ? routeData[currentWaypointIndex + 1].name : "Finish";
        updateRiderPopup(currentSpot, nextSpot);

        map.panTo(livePos);
      }
    });

    function renderTimeline() {
      const container = document.getElementById('timeline');
      container.innerHTML = '';

      routeData.forEach((pt, idx) => {
        const item = document.createElement('div');
        const state = waypointsState[idx] || {};
        const isCurrentSpot = idx === currentWaypointIndex;
        let statusClass = state.arrived ? 'reached' : (isCurrentSpot ? 'current' : '');
        item.className = `timeline-item ${statusClass}`;

        let photos = Array.isArray(state.photos) ? state.photos : (state.photo ? [state.photo] : []);

        item.innerHTML = `
          <div class="timeline-node"></div>
          <div class="timeline-card">
            <div class="place-name"><span>${idx + 1}. ${pt.name}</span>${isCurrentSpot ? '<span>🚴‍♂️</span>' : ''}</div>
            <div class="sched-time">Scheduled: <b>${pt.time}</b></div>
            ${state.arrived ? `<span class="actual-time-badge">✅ Arrived: ${state.arrived} ${state.left ? `| Left: ${state.left}` : ''}</span>` : ''}

            ${photos.length > 0 ? `
              <div class="photo-section-wrap">
                <button id="photo-btn-${idx}" class="photo-toggle-btn" onclick="togglePhotoVisibility(${idx})">📷 Photos (${photos.length})</button>
                <div id="photo-box-${idx}" class="stop-photo-container">
                  <div class="photos-gallery-grid">
                    ${photos.map((pUrl, pIdx) => `
                      <div class="photo-card-item">
                        <img src="${pUrl}" class="stop-photo" onclick="window.open('${pUrl}', '_blank')">
                        <div class="photo-actions-bar">
                          <a href="${pUrl}" download="Ganpati_Darshan_${idx}_${pIdx}.jpg" class="photo-btn-action">⬇️ Save / Download</a>
                          ${isAdmin ? `<button class="photo-btn-action btn-del-photo" onclick="deletePhoto(${idx}, ${pIdx})">🗑️</button>` : ''}
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>
            ` : ''}

            ${isAdmin ? `
              <div class="btn-wrap">
                ${!state.arrived ? `<button class="action-btn btn-arrive" onclick="handleAdminAction(${idx}, 'arrive')">📍 ARRIVED NOW</button>` : ''}
                ${state.arrived && !state.left ? `<button class="action-btn btn-left" onclick="handleAdminAction(${idx}, 'left')">🚀 LEFT NOW</button>` : ''}
                
                <!-- PHOTO UPLOAD BUTTON: SHOWN ONLY AFTER ARRIVED -->
                ${state.arrived ? `<button class="action-btn btn-photo" onclick="triggerPhotoUpload(${idx})">📷 ADD PHOTOS</button>` : ''}
              </div>
            ` : ''}
          </div>
        `;
        container.appendChild(item);
      });
    }

    function togglePhotoVisibility(index) {
      const container = document.getElementById(`photo-box-${index}`);
      container.classList.toggle('visible');
    }

    function triggerPhotoUpload(index) {
      selectedIndexForPhoto = index;
      document.getElementById('photo-file-input').click();
    }

    document.getElementById('photo-file-input').addEventListener('change', async function(e) {
      const files = Array.from(e.target.files);
      if (!files.length || selectedIndexForPhoto === null) return;

      const idx = selectedIndexForPhoto;
      const state = waypointsState[idx] || {};
      let existingPhotos = Array.isArray(state.photos) ? [...state.photos] : (state.photo ? [state.photo] : []);

      for (let file of files) {
        const base64Str = await compressImage(file);
        existingPhotos.push(base64Str);
      }

      db.ref(`liveTrack/waypoints/${idx}/photos`).set(existingPhotos);
      db.ref(`liveTrack/waypoints/${idx}/photo`).remove();
      selectedIndexForPhoto = null;
    });

    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const maxDim = 800;
            let w = img.width, h = img.height;
            if (w > h && w > maxDim) { h *= maxDim / w; w = maxDim; }
            else if (h > maxDim) { w *= maxDim / h; h = maxDim; }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function deletePhoto(stopIndex, photoIndex) {
      if (!isAdmin) return;
      const state = waypointsState[stopIndex] || {};
      let photos = Array.isArray(state.photos) ? [...state.photos] : [];
      photos.splice(photoIndex, 1);
      db.ref(`liveTrack/waypoints/${stopIndex}/photos`).set(photos);
    }

    function handleAdminAction(index, actionType) {
      if (!isAdmin) return;
      
      const now = new Date();
      const timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const currentState = waypointsState[index] || {};

      if (actionType === 'arrive') {
        currentState.arrived = timeString;
      } else if (actionType === 'left') {
        currentState.left = timeString;
      }

      let nextIndex = currentWaypointIndex;
      if (actionType === 'left') {
        nextIndex = Math.min(index + 1, routeData.length - 1);
      } else {
        nextIndex = index;
      }

      db.ref('liveTrack').update({
        index: nextIndex,
        waypoints: { ...waypointsState, [index]: currentState }
      });
    }

    db.ref('liveTrack').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        currentWaypointIndex = data.index || 0;
        waypointsState = data.waypoints || {};
        renderTimeline();
        updateDynamicRoadLines();
      }
    });

    window.onload = () => { initMap(); renderTimeline(); };
  </script>
</body>
</html>
