<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Sirsi Ganpati Darshan Live Tracker</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root{
      --bg-main:#070b14;
      --bg-card:#121b2f;
      --bg-panel:#0d1526;
      --border-color:#23324e;
      --accent-blue:#38bdf8;
      --accent-green:#22c55e;
      --accent-red:#ef4444;
      --accent-amber:#f59e0b;
      --text-main:#f8fafc;
      --text-sub:#94a3b8;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Inter',sans-serif;
    }

    body{
      background:var(--bg-main);
      color:var(--text-main);
      display:flex;
      flex-direction:column;
      height:100vh;
      overflow:hidden;
      position:relative;
    }

    body::before{
      content:'';
      position:fixed;
      inset:0;
      background:
      radial-gradient(circle at top right, rgba(56,189,248,.15), transparent 40%),
      radial-gradient(circle at bottom left, rgba(34,197,94,.12), transparent 40%);
      pointer-events:none;
      z-index:-1;
    }

    /* HEADER */
    header{
      background:rgba(13,21,38,.90);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(255,255,255,.08);
      padding:14px 22px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      z-index:100;
    }

    .brand-wrap{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand-badge{
      background:linear-gradient(135deg, #0284c7, #38bdf8);
      color:white;
      font-weight:800;
      padding:8px 14px;
      border-radius:12px;
      font-size:.85rem;
      letter-spacing:.5px;
      box-shadow:0 10px 25px rgba(56,189,248,.25);
    }

    .brand-title h1{
      font-size:1.15rem;
      color:white;
      font-weight:800;
    }

    .status-badge{
      font-size:.8rem;
      font-weight:700;
      padding:8px 14px;
      border-radius:100px;
      background:rgba(34,197,94,.15);
      color:#22c55e;
      border:1px solid rgba(34,197,94,.35);
    }

    .status-badge.admin-mode{
      background:rgba(239,68,68,.15);
      color:#ef4444;
      border-color:rgba(239,68,68,.35);
    }

    /* HERO BANNER */
    .hero-status-bar{
      background:linear-gradient(90deg, #09111d, #1d4ed8, #09111d);
      border-bottom:2px solid #38bdf8;
      padding:10px 0;
      overflow:hidden;
      white-space:nowrap;
      box-shadow:0 0 20px rgba(56,189,248,.20);
    }

    .marquee-track{
      display:inline-block;
      white-space:nowrap;
      padding-left:100%;
      animation:marquee-scroll 18s linear infinite;
      font-weight:800;
      font-size:.95rem;
      letter-spacing:.5px;
      color:#dbeafe;
      text-shadow:0 0 10px rgba(56,189,248,.6);
    }

    @keyframes marquee-scroll{
      0%{ transform:translateX(0); }
      100%{ transform:translateX(-100%); }
    }

    /* LAYOUT */
    .dashboard-container{
      display:flex;
      flex:1;
      height:calc(100vh - 105px);
    }

    .sidebar{
      width:420px;
      background:rgba(18,27,47,.75);
      backdrop-filter:blur(16px);
      border-right:1px solid rgba(255,255,255,.08);
      display:flex;
      flex-direction:column;
    }

    /* CONTROL PANEL */
    .control-panel{
      padding:18px;
      background:rgba(13,21,38,.85);
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .metrics-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .stat-card{
      background:linear-gradient(135deg, rgba(56,189,248,.10), rgba(18,27,47,.95));
      border-radius:18px;
      padding:18px;
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 10px 25px rgba(0,0,0,.25);
    }

    .stat-card.delayed{
      border-color:rgba(239,68,68,.40);
    }

    .stat-card.green{
      border-color:rgba(34,197,94,.30);
    }

    .stat-label{
      font-size:.7rem;
      color:var(--text-sub);
      font-weight:700;
      text-transform:uppercase;
    }

    .stat-value{
      font-size:1.5rem;
      font-weight:800;
      margin-top:5px;
      color:white;
    }

    /* TIMELINE */
    .timeline-container{
      flex:1;
      overflow-y:auto;
      padding:20px 16px;
    }

    .timeline-container::-webkit-scrollbar{
      width:6px;
    }

    .timeline-container::-webkit-scrollbar-thumb{
      background:#2d3a5c;
      border-radius:10px;
    }

    .timeline-item{
      position:relative;
      padding-left:32px;
      padding-bottom:24px;
    }

    .timeline-item::before{
      content:'';
      position:absolute;
      left:10px;
      top:24px;
      bottom:0;
      width:2px;
      background:rgba(255,255,255,.10);
    }

    .timeline-item:last-child::before{
      display:none;
    }

    .timeline-node{
      position:absolute;
      left:2px;
      top:4px;
      width:18px;
      height:18px;
      border-radius:50%;
      background:#0d1526;
      border:3px solid #64748b;
      z-index:2;
      transition:.3s;
    }

    .timeline-item.reached .timeline-node{
      border-color:#22c55e;
      background:#22c55e;
    }

    .timeline-item.current .timeline-node{
      border-color:#38bdf8;
      background:#070b14;
      transform:scale(1.25);
      box-shadow:0 0 20px rgba(56,189,248,.7);
    }

    .timeline-card{
      background:rgba(21,28,44,.72);
      backdrop-filter:blur(18px);
      border-radius:18px;
      border:1px solid rgba(255,255,255,.08);
      padding:16px;
      box-shadow:0 10px 25px rgba(0,0,0,.25);
      transition:.3s;
    }

    .timeline-card:hover{
      transform:translateY(-3px);
      border-color:#38bdf8;
    }

    .timeline-item.current .timeline-card{
      border:2px solid #38bdf8;
      box-shadow:0 0 25px rgba(56,189,248,.25);
    }

    .place-name{
      font-size:1rem;
      font-weight:800;
      color:#fff;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .sched-time{
      color:#94a3b8;
      margin-top:4px;
      font-size:.8rem;
    }

    /* TELEMETRY */
    .telemetry-box{
      margin-top:12px;
      padding-top:10px;
      border-top:1px dashed rgba(255,255,255,.10);
      display:flex;
      flex-direction:column;
      gap:6px;
      font-size:.8rem;
    }

    .tele-tag{
      font-weight:700;
    }

    .tele-tag.arrived{ color:#22c55e; }
    .tele-tag.left{ color:#f59e0b; }
    .tele-tag.spent{ color:#38bdf8; }

    /* BUTTONS */
    .btn-wrap{
      display:flex;
      gap:8px;
      margin-top:12px;
    }

    .action-btn{
      flex:1;
      border:none;
      border-radius:10px;
      padding:10px;
      color:white;
      font-weight:800;
      cursor:pointer;
      transition:.25s;
    }

    .action-btn:hover{
      transform:translateY(-2px);
    }

    .btn-arrive{
      background:linear-gradient(135deg, #10b981, #059669);
    }

    .btn-left{
      background:linear-gradient(135deg, #f59e0b, #d97706);
    }

    .travel-connector{
      font-size:.75rem;
      color:#c084fc;
      font-weight:700;
      padding:4px 0 10px 32px;
    }

    /* MAP */
    .map-container{
      flex:1;
      position:relative;
    }

    .map-container::after{
      content:'LIVE GPS TRACKING';
      position:absolute;
      top:15px;
      right:15px;
      background:rgba(0,0,0,.7);
      color:#38bdf8;
      padding:10px 16px;
      border-radius:999px;
      font-size:.75rem;
      font-weight:800;
      z-index:1000;
      backdrop-filter:blur(10px);
    }

    #map{
      width:100%;
      height:100%;
      background:#111;
    }

    .cycle-marker-icon{
      font-size:28px;
      text-align:center;
      filter:drop-shadow(0 5px 10px rgba(0,0,0,.50));
    }

    .custom-pin-icon{
      display:flex;
      justify-content:center;
      align-items:center;
      filter:drop-shadow(0 3px 6px rgba(0,0,0,.50));
    }

    /* MOBILE */
    @media(max-width:768px){
      .dashboard-container{
        flex-direction:column-reverse;
      }
      .sidebar{
        width:100%;
        height:50%;
      }
      .map-container{
        height:50%;
      }
      .brand-title h1{
        font-size:.9rem;
      }
      .brand-badge{
        font-size:.75rem;
      }
      .marquee-track{
        font-size:.85rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-wrap">
      <div class="brand-badge">🚴‍♂️ DISPATCH</div>
      <div class="brand-title">
        <h1>SIRSI GANPATI DARSHAN</h1>
      </div>
    </div>
    <div id="mode-badge" class="status-badge">● LIVE VIEWER</div>
  </header>

  <div class="hero-status-bar">
    <div class="marquee-track" id="live-hero-status">
      🔥 PREPARING FOR LAUNCH: GET READY FOR SIRSI GANPATI DARSHAN RIDE!
    </div>
  </div>

  <div class="dashboard-container">
    <div class="sidebar">
      <div class="control-panel">
        <div class="metrics-grid">
          <div class="stat-card" id="status-card">
            <div class="stat-label">Schedule Status</div>
            <div class="stat-value" id="delay-text">0 MINS</div>
          </div>
          <div class="stat-card green">
            <div class="stat-label">Covered Distance</div>
            <div class="stat-value" id="distance-text">0.0 KM</div>
          </div>
        </div>
      </div>

      <div class="timeline-container" id="timeline"></div>
    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('admin') === 'true';

    const modeBadge = document.getElementById('mode-badge');
    if (isAdmin) {
      modeBadge.innerText = '⚡ ADMIN CONTROL';
      modeBadge.classList.add('admin-mode');
    }

    const firebaseConfig = {
      databaseURL: "https://ksrtc-cycle-tracker-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 19 Stop Coordinates in Order
    const routeData = [
      { id: 1, name: "Devikere", time: "16:00", lat: 14.619805, lng: 74.832288 },
      { id: 2, name: "Maratikoppa", time: "16:10", lat: 14.629540, lng: 74.836248 },
      { id: 3, name: "Bapuji Nagar", time: "16:20", lat: 14.624583, lng: 74.840028 },
      { id: 4, name: "Chipgi", time: "16:35", lat: 14.644139, lng: 74.862833 },
      { id: 5, name: "Vivekananda Nagar", time: "16:45", lat: 14.630944, lng: 74.852139 },
      { id: 6, name: "Ayappa Nagar", time: "16:55", lat: 14.618972, lng: 74.845333 },
      { id: 7, name: "Hanumagiri", time: "17:00", lat: 14.614778, lng: 74.845194 },
      { id: 8, name: "Ambedkar Bhavana", time: "17:05", lat: 14.618100, lng: 74.842500 },
      { id: 9, name: "Kotekere", time: "17:08", lat: 14.615861, lng: 74.840944 },
      { id: 10, name: "Marigudi", time: "17:15", lat: 14.612750, lng: 74.838694 },
      { id: 11, name: "Rayar Pete", time: "17:20", lat: 14.610750, lng: 74.830917 },
      { id: 12, name: "Shivaji Chowk", time: "17:25", lat: 14.614610, lng: 74.833974 },
      { id: 13, name: "Auto Stand", time: "17:30", lat: 14.615389, lng: 74.834889 },
      { id: 14, name: "Naganjaneya", time: "17:35", lat: 14.614583, lng: 74.835278 },
      { id: 15, name: "Simpi Gulli", time: "17:40", lat: 14.615250, lng: 74.834389 },
      { id: 16, name: "Unnemutt", time: "17:45", lat: 14.617139, lng: 74.832861 },
      { id: 17, name: "Shraddanand Gulli", time: "17:50", lat: 14.616194, lng: 74.832417 },
      { id: 18, name: "Zoo Circle", time: "18:00", lat: 14.618889, lng: 74.826778 },
      { id: 18, name: "Police Station", time: "18:05", lat: 14.620000, lng: 74.825889 },
      { id: 19, name: "Raghavendra Circle", time: "18:10", lat: 14.623083, lng: 74.827528 }
    ];

    let currentWaypointIndex = 0;
    let waypointsState = {}; 
    let map, cycleMarker;
    let mapMarkers = [];
    let completedPolyline, upcomingPolyline;
    let fullRoadPath = []; 
    let legPaths = []; 

    function createPinIcon(color) {
      const svgPin = `
        <svg width="24" height="32" viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 0C5.37 0 0 5.37 0 12C0 21 12 32 12 32C12 32 24 21 24 12C24 5.37 18.63 0 12 0ZM12 16C9.79 16 8 14.21 8 12C8 9.79 9.79 8 12 8C14.21 8 16 9.79 16 12C16 14.21 14.21 16 12 16Z" fill="${color}"/>
        </svg>
      `;
      return L.divIcon({ className: 'custom-pin-icon', html: svgPin, iconSize: [24, 32], iconAnchor: [12, 32] });
    }

    // Fetch real road paths using OSRM API
    async function fetchOSRMRoute() {
      const coordString = routeData.map(pt => `${pt.lng},${pt.lat}`).join(';');
      const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordString}?overview=full&geometries=geojson`;

      try {
        const response = await fetch(osrmUrl);
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          const coords = data.routes[0].geometry.coordinates;
          fullRoadPath = coords.map(c => [c[1], c[0]]); // Swap [lng, lat] to [lat, lng]
          
          // Separate into individual legs between stops
          legPaths = [];
          for (let i = 0; i < routeData.length - 1; i++) {
            const startPt = [routeData[i].lat, routeData[i].lng];
            const endPt = [routeData[i + 1].lat, routeData[i + 1].lng];
            
            // Sub-fetch individual leg for precise snapping
            const legUrl = `https://router.project-osrm.org/route/v1/driving/${startPt[1]},${startPt[0]};${endPt[1]},${endPt[0]}?overview=full&geometries=geojson`;
            const legRes = await fetch(legUrl);
            const legData = await legRes.json();
            
            if (legData.routes && legData.routes[0]) {
              const legCoords = legData.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
              legPaths.push(legCoords);
            } else {
              legPaths.push([startPt, endPt]);
            }
          }
        } else {
          fallbackStraightLines();
        }
      } catch (err) {
        console.warn("OSRM error, falling back to direct points:", err);
        fallbackStraightLines();
      }

      updatePathLines();
    }

    function fallbackStraightLines() {
      legPaths = [];
      for (let i = 0; i < routeData.length - 1; i++) {
        legPaths.push([
          [routeData[i].lat, routeData[i].lng],
          [routeData[i + 1].lat, routeData[i + 1].lng]
        ]);
      }
    }

    function initMap() {
      map = L.map('map', { maxZoom: 19 }).setView([routeData[0].lat, routeData[0].lng], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        referrerPolicy: 'strict-origin-when-cross-origin',
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      completedPolyline = L.polyline([], { color: '#2ecc71', weight: 5, opacity: 0.95 }).addTo(map);
      upcomingPolyline = L.polyline([], { color: '#38bdf8', weight: 4, opacity: 0.75, dashArray: '6, 8' }).addTo(map);

      routeData.forEach((pt, index) => {
        const pinColor = index < currentWaypointIndex ? '#2ecc71' : '#38bdf8';
        const marker = L.marker([pt.lat, pt.lng], { icon: createPinIcon(pinColor) })
          .addTo(map)
          .bindPopup(`<div style="color:#000;"><b>${index + 1}. ${pt.name}</b><br>Scheduled: ${pt.time}</div>`);
        
        mapMarkers.push(marker);
      });

      const cycleIcon = L.divIcon({ className: 'cycle-marker-icon', html: '🚴‍♂️', iconSize: [30, 30], iconAnchor: [15, 15] });
      cycleMarker = L.marker([routeData[0].lat, routeData[0].lng], { icon: cycleIcon }).addTo(map);

      fetchOSRMRoute();
    }

    function calculateLegDistance(idx1, idx2) {
      if (idx1 < 0 || idx2 >= routeData.length) return "0.0";
      const p1 = L.latLng(routeData[idx1].lat, routeData[idx1].lng);
      const p2 = L.latLng(routeData[idx2].lat, routeData[idx2].lng);
      return (p1.distanceTo(p2) / 1000).toFixed(2);
    }

    function updateHeroStatusBanner() {
      const banner = document.getElementById('live-hero-status');
      const totalStops = routeData.length;
      const curSpot = routeData[currentWaypointIndex];
      const curState = waypointsState[currentWaypointIndex] || {};
      const lastSpotState = currentWaypointIndex > 0 ? (waypointsState[currentWaypointIndex - 1] || {}) : {};
      const prevSpot = currentWaypointIndex > 0 ? routeData[currentWaypointIndex - 1] : null;

      if (currentWaypointIndex === 0) {
        if (curState.arrived) {
          banner.innerHTML = `⚡ RIDER HAS ARRIVED AT ${curSpot.name.toUpperCase()}! THE DARSHAN RIDE IS LIVE! 🙏 &nbsp;&nbsp;•&nbsp;&nbsp; 🔥 SIRSI GANPATI DARSHAN 2026`;
        } else {
          banner.innerHTML = `🔥 THE JOURNEY BEGINS! RIDER WILL BE AT ${curSpot.name.toUpperCase()} SOON! 🚴‍♂️ &nbsp;&nbsp;•&nbsp;&nbsp; GET READY!`;
        }
        return;
      }

      if (currentWaypointIndex === totalStops - 1 && curState.arrived) {
        banner.innerHTML = `🏆 RIDE COMPLETED! VICTORY AT ${curSpot.name.toUpperCase()}! SHREE GANPATI BAPPA MORYA! 🎉 &nbsp;&nbsp;•&nbsp;&nbsp; ALL STOPS COVERED!`;
        return;
      }

      if (curState.arrived && !curState.left) {
        banner.innerHTML = `✨ RIDER HAS ARRIVED AT ${curSpot.name.toUpperCase()}! DARSHAN IN PROGRESS! 🙏 &nbsp;&nbsp;•&nbsp;&nbsp; LIVE UPDATES ACTIVE`;
      } else if (prevSpot && lastSpotState.left) {
        const legDist = calculateLegDistance(currentWaypointIndex - 1, currentWaypointIndex);
        banner.innerHTML = `🚀 ON THE MOVE! RIDER LEFT ${prevSpot.name.toUpperCase()} — JUST ${legDist} KM AWAY FROM ${curSpot.name.toUpperCase()}! 🚴‍♂️💨 &nbsp;&nbsp;•&nbsp;&nbsp; NEXT STOP: ${curSpot.name.toUpperCase()}`;
      } else {
        banner.innerHTML = `🚴‍♂️ RIDER IS SPEEDING TOWARDS ${curSpot.name.toUpperCase()}! STAND BY FOR ARRIVAL! 🔥 &nbsp;&nbsp;•&nbsp;&nbsp; LIVE TRACKING`;
      }
    }

    function updatePathLines() {
      if (legPaths.length === 0) return;

      let completedCoords = [];
      let upcomingCoords = [];

      for (let i = 0; i < legPaths.length; i++) {
        if (i < currentWaypointIndex) {
          completedCoords.push(...legPaths[i]);
        } else {
          upcomingCoords.push(...legPaths[i]);
        }
      }

      completedPolyline.setLatLngs(completedCoords);
      upcomingPolyline.setLatLngs(upcomingCoords);

      let distMeters = 0;
      for (let i = 0; i < currentWaypointIndex; i++) {
        const p1 = L.latLng(routeData[i].lat, routeData[i].lng);
        const p2 = L.latLng(routeData[i + 1].lat, routeData[i + 1].lng);
        distMeters += p1.distanceTo(p2);
      }
      document.getElementById('distance-text').innerText = `${(distMeters / 1000).toFixed(2)} KM`;

      routeData.forEach((pt, index) => {
        const pinColor = index < currentWaypointIndex ? '#2ecc71' : '#38bdf8';
        mapMarkers[index].setIcon(createPinIcon(pinColor));
      });
    }

    function calculateTimeDiffMinutes(timeStr1, timeStr2) {
      if (!timeStr1 || !timeStr2) return null;
      const [h1, m1] = timeStr1.split(':').map(Number);
      const [h2, m2] = timeStr2.split(':').map(Number);
      const diff = (h2 * 60 + m2) - (h1 * 60 + m1);
      return diff >= 0 ? diff : null;
    }

    function renderTimeline() {
      const container = document.getElementById('timeline');
      container.innerHTML = '';

      routeData.forEach((pt, idx) => {
        const item = document.createElement('div');
        const state = waypointsState[idx] || {};

        let statusClass = idx < currentWaypointIndex ? 'reached' : (idx === currentWaypointIndex ? 'current' : '');
        item.className = `timeline-item ${statusClass}`;

        const isCurrentSpot = idx === currentWaypointIndex;
        const arrivedTime = state.arrived || null;
        const leftTime = state.left || null;

        let timeSpent = calculateTimeDiffMinutes(arrivedTime, leftTime);
        let travelDuration = null;
        if (idx > 0 && waypointsState[idx - 1]?.left && arrivedTime) {
          travelDuration = calculateTimeDiffMinutes(waypointsState[idx - 1].left, arrivedTime);
        }

        item.innerHTML = `
          <div class="timeline-node"></div>
          <div class="timeline-card">
            <div class="place-name">
              <span>${idx + 1}. ${pt.name}</span>
              ${isCurrentSpot ? '<span>🚴‍♂️</span>' : ''}
            </div>
            <div class="sched-time">Scheduled: <b>${pt.time}</b></div>

            ${(arrivedTime || leftTime || timeSpent !== null) ? `
              <div class="telemetry-box">
                ${arrivedTime ? `<div class="tele-tag arrived">📍 Arrived at: ${arrivedTime}</div>` : ''}
                ${leftTime ? `<div class="tele-tag left">🚀 Left at: ${leftTime}</div>` : ''}
                ${timeSpent !== null ? `<div class="tele-tag spent">⏱️ Time Spent: ${timeSpent} mins</div>` : ''}
              </div>
            ` : ''}

            ${isAdmin && isCurrentSpot ? `
              <div class="btn-wrap">
                ${!arrivedTime ? `<button class="action-btn btn-arrive" onclick="handleAdminAction(${idx}, 'arrive')">ARRIVED NOW</button>` : ''}
                ${arrivedTime && !leftTime ? `<button class="action-btn btn-left" onclick="handleAdminAction(${idx}, 'left')">LEFT NOW</button>` : ''}
              </div>
            ` : ''}
          </div>
        `;

        container.appendChild(item);

        if (travelDuration !== null) {
          const connector = document.createElement('div');
          connector.className = 'travel-connector';
          connector.innerHTML = `🚲 Travel Time from previous stop: <b>${travelDuration} mins</b>`;
          container.insertBefore(connector, item);
        }
      });
    }

    function handleAdminAction(index, actionType) {
      if (!isAdmin) return;

      const now = new Date();
      const currentHours = String(now.getHours()).padStart(2, '0');
      const currentMinutes = String(now.getMinutes()).padStart(2, '0');
      const timeString = `${currentHours}:${currentMinutes}`;

      const currentState = waypointsState[index] || {};

      if (actionType === 'arrive') {
        currentState.arrived = timeString;
      } else if (actionType === 'left') {
        currentState.left = timeString;
      }

      const scheduledTimeStr = routeData[index].time;
      const [schedH, schedM] = scheduledTimeStr.split(':').map(Number);
      const scheduledDate = new Date();
      scheduledDate.setHours(schedH, schedM, 0);

      const diffMins = Math.round((now - scheduledDate) / 60000);

      let nextIndex = currentWaypointIndex;
      if (actionType === 'left') {
        nextIndex = Math.min(routeData.length - 1, currentWaypointIndex + 1);
      }

      db.ref('liveTrack').set({
        index: nextIndex,
        delayMins: diffMins,
        lastUpdated: timeString,
        waypoints: {
          ...waypointsState,
          [index]: currentState
        }
      });
    }

    db.ref('liveTrack').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        currentWaypointIndex = data.index || 0;
        waypointsState = data.waypoints || {};
        updateDelayUI(data.delayMins || 0);

        const currentPt = routeData[currentWaypointIndex];
        cycleMarker.setLatLng([currentPt.lat, currentPt.lng]);
        map.panTo([currentPt.lat, currentPt.lng]);

        updateHeroStatusBanner();
        updatePathLines();
        renderTimeline();
      }
    });

    function updateDelayUI(diffMins) {
      const delayText = document.getElementById('delay-text');
      const delayCard = document.getElementById('status-card');

      if (diffMins > 0) {
        delayText.innerText = `+${diffMins} MINS`;
        delayText.style.color = 'var(--accent-red)';
        delayCard.classList.add('delayed');
      } else if (diffMins < 0) {
        delayText.innerText = `${Math.abs(diffMins)} MINS AHEAD`;
        delayText.style.color = 'var(--accent-green)';
        delayCard.classList.remove('delayed');
      } else {
        delayText.innerText = `ON TIME`;
        delayText.style.color = 'var(--accent-green)';
        delayCard.classList.remove('delayed');
      }
    }

    window.onload = () => {
      initMap();
      renderTimeline();
      updateHeroStatusBanner();
    };
  </script>
</body>
</html>
