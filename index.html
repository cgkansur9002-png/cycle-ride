<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Sirsi Ganpati Darshan Live Tracker</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --theme-blue: #3498db;
      --theme-dark: #121824;
      --theme-card: #1e2736;
      --theme-border: #2e3a4e;
      --theme-text: #e2e8f0;
      --theme-green: #2ecc71;
      --theme-red: #c82333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--theme-dark); color: var(--theme-text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header {
      background-color: #0f141d;
      border-bottom: 2px solid var(--theme-blue);
      padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .brand-logo { background: var(--theme-blue); color: #fff; font-weight: 900; padding: 5px 10px; border-radius: 4px; font-size: 0.9rem; letter-spacing: 0.5px; }
    .brand-title h1 { font-size: 1.1rem; color: #fff; font-weight: 700; }

    .dashboard-container { display: flex; flex: 1; height: calc(100vh - 60px); }
    .sidebar { width: 380px; background-color: var(--theme-card); border-right: 1px solid var(--theme-border); display: flex; flex-direction: column; z-index: 2; }
    
    .control-panel { padding: 15px; background-color: #161e2b; border-bottom: 1px solid var(--theme-border); }
    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .stat-card { background-color: #0f141d; border-radius: 6px; padding: 10px; border-left: 3px solid var(--theme-blue); }
    .stat-card.delayed { border-left-color: var(--theme-red); }
    .stat-card.green { border-left-color: var(--theme-green); }
    .stat-value { font-size: 1.1rem; font-weight: 800; margin-top: 2px; }

    .timeline-list { flex: 1; overflow-y: auto; padding: 15px; }
    .waypoint-card { background-color: var(--theme-dark); border: 1px solid var(--theme-border); border-radius: 6px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
    .waypoint-card.reached { border-color: var(--theme-green); opacity: 0.55; }
    .waypoint-card.current { border-color: var(--theme-blue); box-shadow: 0 0 8px rgba(52, 152, 219, 0.25); }

    .waypoint-actions button { background: var(--theme-blue); border: none; color: #fff; padding: 7px 12px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
    .waypoint-actions button:hover { background: #2980b9; }

    .map-container { flex: 1; }
    #map { width: 100%; height: 100%; }
    .cycle-marker-icon { font-size: 24px; text-align: center; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); }

    .custom-pin-icon { display: flex; justify-content: center; align-items: center; }

    @media (max-width: 768px) {
      .dashboard-container { flex-direction: column-reverse; }
      .sidebar { width: 100%; height: 50%; }
      .map-container { height: 50%; }
    }
  </style>
</head>
<body>

  <header>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="brand-logo">🚴‍♂️ CYCLE DISPATCH</div>
      <div class="brand-title">
        <h1>SIRSI GANPATI DARSHAN LIVE</h1>
      </div>
    </div>
    <div id="mode-badge" style="font-size:0.8rem; color:var(--theme-green); font-weight: 600;">● LIVE VIEWER MODE</div>
  </header>

  <div class="dashboard-container">
    <div class="sidebar">
      <div class="control-panel">
        <div class="metrics-grid">
          <div class="stat-card" id="status-card">
            <div style="font-size:0.65rem; color:#94a3b8; font-weight: 600;">SCHEDULE STATUS</div>
            <div class="stat-value" id="delay-text">0 MINS</div>
          </div>
          <div class="stat-card green">
            <div style="font-size:0.65rem; color:#94a3b8; font-weight: 600;">DIRECT ROAD DISTANCE</div>
            <div class="stat-value" id="distance-text">0.0 KM</div>
          </div>
        </div>
      </div>

      <div class="timeline-list" id="timeline"></div>
    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // Check if the user is in Admin mode via URL query parameter (?admin=true)
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('admin') === 'true';

    if (isAdmin) {
      document.getElementById('mode-badge').innerText = '⚡ ADMIN CONTROL MODE';
      document.getElementById('mode-badge').style.color = '#e74c3c';
    }

    const firebaseConfig = {
      databaseURL: "https://ksrtc-cycle-tracker-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const routeData = [
      { id: 1, name: "Devikere", time: "16:00", lat: 14.619805, lng: 74.832288 },
      { id: 2, name: "Maratikoppa", time: "16:10", lat: 14.629540, lng: 74.836248 },
      { id: 3, name: "Bapuji Nagar", time: "16:20", lat: 14.624583, lng: 74.840028 },
      { id: 4, name: "Chipgi", time: "16:35", lat: 14.644139, lng: 74.862833 },
      { id: 5, name: "Vivekananda Nagar", time: "16:45", lat: 14.630944, lng: 74.852139 },
      { id: 6, name: "Ayappa Nagar", time: "16:55", lat: 14.627220, lng: 74.848500 },
      { id: 7, name: "Hanumagiri", time: "17:00", lat: 14.614778, lng: 74.845194 },
      { id: 8, name: "Ambedkar Bhavana", time: "17:05", lat: 14.618100, lng: 74.842500 },
      { id: 9, name: "Kotekere", time: "17:08", lat: 14.615861, lng: 74.840944 },
      { id: 10, name: "Marigudi", time: "17:15", lat: 14.612750, lng: 74.838694 },
      { id: 11, name: "Rayar Pete", time: "17:20", lat: 14.610750, lng: 74.830917 },
      { id: 12, name: "Shivaji Chowk", time: "17:25", lat: 14.614610, lng: 74.833974 },
      { id: 13, name: "Auto Stand", time: "17:30", lat: 14.614900, lng: 74.834500 },
      { id: 14, name: "Naganjaneya", time: "17:35", lat: 14.614583, lng: 74.835278 },
      { id: 15, name: "Simpi Gulli", time: "17:40", lat: 14.615250, lng: 74.834389 },
      { id: 16, name: "Unnemutt", time: "17:45", lat: 14.617139, lng: 74.832861 },
      { id: 17, name: "Shraddanand Gulli", time: "17:50", lat: 14.616194, lng: 74.832417 },
      { id: 18, name: "Zoo Circle", time: "18:00", lat: 14.618889, lng: 74.826778 },
      { id: 19, name: "Raghavendra Circle", time: "18:05", lat: 14.623083, lng: 74.827528 }
    ];

    let currentWaypointIndex = 0;
    let map, cycleMarker;
    let mapMarkers = [];
    let completedPolyline, upcomingPolyline;

    function createPinIcon(color) {
      const svgPin = `
        <svg width="24" height="32" viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 0C5.37 0 0 5.37 0 12C0 21 12 32 12 32C12 32 24 21 24 12C24 5.37 18.63 0 12 0ZM12 16C9.79 16 8 14.21 8 12C8 9.79 9.79 8 12 8C14.21 8 16 9.79 16 12C16 14.21 14.21 16 12 16Z" fill="${color}"/>
        </svg>
      `;
      return L.divIcon({
        className: 'custom-pin-icon',
        html: svgPin,
        iconSize: [24, 32],
        iconAnchor: [12, 32]
      });
    }

    function initMap() {
      map = L.map('map', { maxZoom: 19 }).setView([routeData[0].lat, routeData[0].lng], 14);

      // Explicit referrer policy added to prevent "Access Blocked" on OpenStreetMap tiles
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        referrerPolicy: 'strict-origin-when-cross-origin',
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      completedPolyline = L.polyline([], { color: '#2ecc71', weight: 5, opacity: 0.9 }).addTo(map);
      upcomingPolyline = L.polyline([], { color: '#3498db', weight: 4, opacity: 0.8 }).addTo(map);

      routeData.forEach((pt, index) => {
        const pinColor = index < currentWaypointIndex ? '#2ecc71' : '#3498db';
        const marker = L.marker([pt.lat, pt.lng], { icon: createPinIcon(pinColor) })
          .addTo(map)
          .bindPopup(`<b>${index + 1}. ${pt.name}</b><br>Scheduled: ${pt.time}`);
        
        mapMarkers.push(marker);
      });

      const cycleIcon = L.divIcon({ className: 'cycle-marker-icon', html: '🚴‍♂️', iconSize: [30, 30], iconAnchor: [15, 15] });
      cycleMarker = L.marker([routeData[0].lat, routeData[0].lng], { icon: cycleIcon }).addTo(map);

      updatePathLines();
    }

    function updatePathLines() {
      const completedCoords = routeData.slice(0, currentWaypointIndex + 1).map(pt => [pt.lat, pt.lng]);
      const upcomingCoords = routeData.slice(currentWaypointIndex).map(pt => [pt.lat, pt.lng]);

      completedPolyline.setLatLngs(completedCoords);
      upcomingPolyline.setLatLngs(upcomingCoords);

      let distMeters = 0;
      for (let i = 0; i < currentWaypointIndex; i++) {
        const p1 = L.latLng(routeData[i].lat, routeData[i].lng);
        const p2 = L.latLng(routeData[i + 1].lat, routeData[i + 1].lng);
        distMeters += p1.distanceTo(p2);
      }
      document.getElementById('distance-text').innerText = `${(distMeters / 1000).toFixed(2)} KM`;

      routeData.forEach((pt, index) => {
        const pinColor = index < currentWaypointIndex ? '#2ecc71' : '#3498db';
        mapMarkers[index].setIcon(createPinIcon(pinColor));
      });
    }

    function renderTimeline() {
      const container = document.getElementById('timeline');
      container.innerHTML = '';

      routeData.forEach((pt, idx) => {
        const card = document.createElement('div');
        let statusClass = idx < currentWaypointIndex ? 'reached' : (idx === currentWaypointIndex ? 'current' : '');

        card.className = `waypoint-card ${statusClass}`;
        
        // Show update button ONLY if the URL contains ?admin=true
        const showButton = isAdmin && (idx === currentWaypointIndex);

        card.innerHTML = `
          <div>
            <h4 style="font-size:0.9rem;">${idx + 1}. ${pt.name} 🚴‍♂️</h4>
            <p style="font-size:0.75rem; color:#94a3b8;">Scheduled: <b>${pt.time}</b></p>
          </div>
          <div class="waypoint-actions">
            ${showButton ? `<button onclick="sendArrivalUpdate(${idx})">ARRIVED HERE</button>` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function sendArrivalUpdate(index) {
      if (!isAdmin) return;

      const now = new Date();
      const currentHours = String(now.getHours()).padStart(2, '0');
      const currentMinutes = String(now.getMinutes()).padStart(2, '0');
      
      const scheduledTimeStr = routeData[index].time;
      const [schedH, schedM] = scheduledTimeStr.split(':').map(Number);
      const scheduledDate = new Date();
      scheduledDate.setHours(schedH, schedM, 0);

      const diffMins = Math.round((now - scheduledDate) / 60000);

      db.ref('liveTrack').set({
        index: index < routeData.length - 1 ? index + 1 : index,
        delayMins: diffMins,
        lastUpdated: `${currentHours}:${currentMinutes}`
      });
    }

    // Live Sync Listener across all connected devices
    db.ref('liveTrack').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        currentWaypointIndex = data.index;
        updateDelayUI(data.delayMins);

        const currentPt = routeData[currentWaypointIndex];
        cycleMarker.setLatLng([currentPt.lat, currentPt.lng]);
        map.panTo([currentPt.lat, currentPt.lng]);

        updatePathLines();
        renderTimeline();
      }
    });

    function updateDelayUI(diffMins) {
      const delayText = document.getElementById('delay-text');
      const delayCard = document.getElementById('status-card');

      if (diffMins > 0) {
        delayText.innerText = `+${diffMins} MINS`;
        delayText.style.color = '#c82333';
        delayCard.classList.add('delayed');
      } else if (diffMins < 0) {
        delayText.innerText = `${Math.abs(diffMins)} MINS AHEAD`;
        delayText.style.color = '#2ecc71';
        delayCard.classList.remove('delayed');
      } else {
        delayText.innerText = `ON TIME`;
        delayText.style.color = '#2ecc71';
        delayCard.classList.remove('delayed');
      }
    }

    window.onload = () => {
      initMap();
      renderTimeline();
    };
  </script>
</body>
</html>
