<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Sirsi Ganpati Darshan Live Tracker</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151c2c;
      --bg-panel: #111726;
      --border-color: #232f48;
      --accent-blue: #38bdf8;
      --accent-green: #2ecc71;
      --accent-red: #f87171;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Header */
    header {
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      z-index: 10;
    }

    .brand-wrap { display: flex; align-items: center; gap: 12px; }
    .brand-badge { background: linear-gradient(135deg, #0284c7, #38bdf8); color: #fff; font-weight: 800; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; letter-spacing: 0.5px; box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3); }
    .brand-title h1 { font-size: 1.1rem; color: #fff; font-weight: 700; letter-spacing: -0.3px; }

    .status-badge { font-size: 0.8rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: rgba(46, 204, 113, 0.15); color: var(--accent-green); border: 1px solid rgba(46, 204, 113, 0.3); }
    .status-badge.admin-mode { background: rgba(248, 113, 113, 0.15); color: var(--accent-red); border-color: rgba(248, 113, 113, 0.3); }

    /* Main Container */
    .dashboard-container { display: flex; flex: 1; height: calc(100vh - 61px); }
    .sidebar { width: 380px; background-color: var(--bg-card); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 5; }
    
    .control-panel { padding: 16px; background-color: var(--bg-panel); border-bottom: 1px solid var(--border-color); }
    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .stat-card { background-color: var(--bg-card); border-radius: 8px; padding: 12px; border-left: 4px solid var(--accent-blue); border-top: 1px solid var(--border-color); border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); }
    .stat-card.delayed { border-left-color: var(--accent-red); }
    .stat-card.green { border-left-color: var(--accent-green); }
    .stat-label { font-size: 0.65rem; color: var(--text-sub); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
    .stat-value { font-size: 1.15rem; font-weight: 800; margin-top: 4px; color: #fff; }

    /* Timeline Section */
    .timeline-list { flex: 1; overflow-y: auto; padding: 16px; }
    .timeline-list::-webkit-scrollbar { width: 6px; }
    .timeline-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

    .waypoint-card { background-color: var(--bg-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; transition: all 0.25s ease; }
    .waypoint-card.reached { border-color: rgba(46, 204, 113, 0.4); background-color: rgba(46, 204, 113, 0.03); opacity: 0.6; }
    .waypoint-card.current { border-color: var(--accent-blue); background-color: rgba(56, 189, 248, 0.08); box-shadow: 0 0 12px rgba(56, 189, 248, 0.2); }

    .waypoint-title { font-size: 0.92rem; font-weight: 700; color: #fff; }
    .waypoint-time { font-size: 0.78rem; color: var(--text-sub); margin-top: 2px; }

    .waypoint-actions button { background: linear-gradient(135deg, #0284c7, #38bdf8); border: none; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; cursor: pointer; transition: transform 0.1s, box-shadow 0.2s; box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3); }
    .waypoint-actions button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4); }
    .waypoint-actions button:active { transform: translateY(0); }

    /* Map Section */
    .map-container { flex: 1; }
    #map { width: 100%; height: 100%; background-color: #111; }
    
    .cycle-marker-icon { font-size: 26px; text-align: center; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.8)); }
    .custom-pin-icon { display: flex; justify-content: center; align-items: center; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

    /* Mobile Responsive Layout */
    @media (max-width: 768px) {
      .dashboard-container { flex-direction: column-reverse; }
      .sidebar { width: 100%; height: 48%; }
      .map-container { height: 52%; }
      header { padding: 10px 14px; }
      .brand-title h1 { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-wrap">
      <div class="brand-badge">🚴‍♂️ DISPATCH</div>
      <div class="brand-title">
        <h1>SIRSI GANPATI DARSHAN</h1>
      </div>
    </div>
    <div id="mode-badge" class="status-badge">● LIVE VIEWER</div>
  </header>

  <div class="dashboard-container">
    <div class="sidebar">
      <div class="control-panel">
        <div class="metrics-grid">
          <div class="stat-card" id="status-card">
            <div class="stat-label">Schedule Status</div>
            <div class="stat-value" id="delay-text">0 MINS</div>
          </div>
          <div class="stat-card green">
            <div class="stat-label">Covered Distance</div>
            <div class="stat-value" id="distance-text">0.0 KM</div>
          </div>
        </div>
      </div>

      <div class="timeline-list" id="timeline"></div>
    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('admin') === 'true';

    const modeBadge = document.getElementById('mode-badge');
    if (isAdmin) {
      modeBadge.innerText = '⚡ ADMIN CONTROL';
      modeBadge.classList.add('admin-mode');
    }

    const firebaseConfig = {
      databaseURL: "https://ksrtc-cycle-tracker-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const routeData = [
      { id: 1, name: "Devikere", time: "16:00", lat: 14.619805, lng: 74.832288 },
      { id: 2, name: "Maratikoppa", time: "16:10", lat: 14.629540, lng: 74.836248 },
      { id: 3, name: "Bapuji Nagar", time: "16:20", lat: 14.624583, lng: 74.840028 },
      { id: 4, name: "Chipgi", time: "16:35", lat: 14.644139, lng: 74.862833 },
      { id: 5, name: "Vivekananda Nagar", time: "16:45", lat: 14.630944, lng: 74.852139 },
      { id: 6, name: "Ayappa Nagar", time: "16:55", lat: 14.627220, lng: 74.848500 },
      { id: 7, name: "Hanumagiri", time: "17:00", lat: 14.614778, lng: 74.845194 },
      { id: 8, name: "Ambedkar Bhavana", time: "17:05", lat: 14.618100, lng: 74.842500 },
      { id: 9, name: "Kotekere", time: "17:08", lat: 14.615861, lng: 74.840944 },
      { id: 10, name: "Marigudi", time: "17:15", lat: 14.612750, lng: 74.838694 },
      { id: 11, name: "Rayar Pete", time: "17:20", lat: 14.610750, lng: 74.830917 },
      { id: 12, name: "Shivaji Chowk", time: "17:25", lat: 14.614610, lng: 74.833974 },
      { id: 13, name: "Auto Stand", time: "17:30", lat: 14.614900, lng: 74.834500 },
      { id: 14, name: "Naganjaneya", time: "17:35", lat: 14.614583, lng: 74.835278 },
      { id: 15, name: "Simpi Gulli", time: "17:40", lat: 14.615250, lng: 74.834389 },
      { id: 16, name: "Unnemutt", time: "17:45", lat: 14.617139, lng: 74.832861 },
      { id: 17, name: "Shraddanand Gulli", time: "17:50", lat: 14.616194, lng: 74.832417 },
      { id: 18, name: "Zoo Circle", time: "18:00", lat: 14.618889, lng: 74.826778 },
      { id: 19, name: "Raghavendra Circle", time: "18:05", lat: 14.623083, lng: 74.827528 }
    ];

    let currentWaypointIndex = 0;
    let map, cycleMarker;
    let mapMarkers = [];
    let completedPolyline, upcomingPolyline;

    function createPinIcon(color) {
      const svgPin = `
        <svg width="24" height="32" viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 0C5.37 0 0 5.37 0 12C0 21 12 32 12 32C12 32 24 21 24 12C24 5.37 18.63 0 12 0ZM12 16C9.79 16 8 14.21 8 12C8 9.79 9.79 8 12 8C14.21 8 16 9.79 16 12C16 14.21 14.21 16 12 16Z" fill="${color}"/>
        </svg>
      `;
      return L.divIcon({
        className: 'custom-pin-icon',
        html: svgPin,
        iconSize: [24, 32],
        iconAnchor: [12, 32]
      });
    }

    function initMap() {
      map = L.map('map', { maxZoom: 19 }).setView([routeData[0].lat, routeData[0].lng], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        referrerPolicy: 'strict-origin-when-cross-origin',
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      completedPolyline = L.polyline([], { color: '#2ecc71', weight: 5, opacity: 0.95 }).addTo(map);
      upcomingPolyline = L.polyline([], { color: '#38bdf8', weight: 4, opacity: 0.75, dashArray: '6, 8' }).addTo(map);

      routeData.forEach((pt, index) => {
        const pinColor = index < currentWaypointIndex ? '#2ecc71' : '#38bdf8';
        const marker = L.marker([pt.lat, pt.lng], { icon: createPinIcon(pinColor) })
          .addTo(map)
          .bindPopup(`<div style="color:#000;"><b>${index + 1}. ${pt.name}</b><br>Scheduled: ${pt.time}</div>`);
        
        mapMarkers.push(marker);
      });

      const cycleIcon = L.divIcon({ className: 'cycle-marker-icon', html: '🚴‍♂️', iconSize: [30, 30], iconAnchor: [15, 15] });
      cycleMarker = L.marker([routeData[0].lat, routeData[0].lng], { icon: cycleIcon }).addTo(map);

      updatePathLines();
    }

    function updatePathLines() {
      const completedCoords = routeData.slice(0, currentWaypointIndex + 1).map(pt => [pt.lat, pt.lng]);
      const upcomingCoords = routeData.slice(currentWaypointIndex).map(pt => [pt.lat, pt.lng]);

      completedPolyline.setLatLngs(completedCoords);
      upcomingPolyline.setLatLngs(upcomingCoords);

      let distMeters = 0;
      for (let i = 0; i < currentWaypointIndex; i++) {
        const p1 = L.latLng(routeData[i].lat, routeData[i].lng);
        const p2 = L.latLng(routeData[i + 1].lat, routeData[i + 1].lng);
        distMeters += p1.distanceTo(p2);
      }
      document.getElementById('distance-text').innerText = `${(distMeters / 1000).toFixed(2)} KM`;

      routeData.forEach((pt, index) => {
        const pinColor = index < currentWaypointIndex ? '#2ecc71' : '#38bdf8';
        mapMarkers[index].setIcon(createPinIcon(pinColor));
      });
    }

    function renderTimeline() {
      const container = document.getElementById('timeline');
      container.innerHTML = '';

      routeData.forEach((pt, idx) => {
        const card = document.createElement('div');
        let statusClass = idx < currentWaypointIndex ? 'reached' : (idx === currentWaypointIndex ? 'current' : '');

        card.className = `waypoint-card ${statusClass}`;
        const showButton = isAdmin && (idx === currentWaypointIndex);

        card.innerHTML = `
          <div>
            <div class="waypoint-title">${idx + 1}. ${pt.name} 🚴‍♂️</div>
            <div class="waypoint-time">Scheduled: <b>${pt.time}</b></div>
          </div>
          <div class="waypoint-actions">
            ${showButton ? `<button onclick="sendArrivalUpdate(${idx})">ARRIVED HERE</button>` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function sendArrivalUpdate(index) {
      if (!isAdmin) return;

      const now = new Date();
      const currentHours = String(now.getHours()).padStart(2, '0');
      const currentMinutes = String(now.getMinutes()).padStart(2, '0');
      
      const scheduledTimeStr = routeData[index].time;
      const [schedH, schedM] = scheduledTimeStr.split(':').map(Number);
      const scheduledDate = new Date();
      scheduledDate.setHours(schedH, schedM, 0);

      const diffMins = Math.round((now - scheduledDate) / 60000);

      db.ref('liveTrack').set({
        index: index < routeData.length - 1 ? index + 1 : index,
        delayMins: diffMins,
        lastUpdated: `${currentHours}:${currentMinutes}`
      });
    }

    db.ref('liveTrack').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        currentWaypointIndex = data.index;
        updateDelayUI(data.delayMins);

        const currentPt = routeData[currentWaypointIndex];
        cycleMarker.setLatLng([currentPt.lat, currentPt.lng]);
        map.panTo([currentPt.lat, currentPt.lng]);

        updatePathLines();
        renderTimeline();
      }
    });

    function updateDelayUI(diffMins) {
      const delayText = document.getElementById('delay-text');
      const delayCard = document.getElementById('status-card');

      if (diffMins > 0) {
        delayText.innerText = `+${diffMins} MINS`;
        delayText.style.color = 'var(--accent-red)';
        delayCard.classList.add('delayed');
      } else if (diffMins < 0) {
        delayText.innerText = `${Math.abs(diffMins)} MINS AHEAD`;
        delayText.style.color = 'var(--accent-green)';
        delayCard.classList.remove('delayed');
      } else {
        delayText.innerText = `ON TIME`;
        delayText.style.color = 'var(--accent-green)';
        delayCard.classList.remove('delayed');
      }
    }

    window.onload = () => {
      initMap();
      renderTimeline();
    };
  </script>
</body>
</html>
